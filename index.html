<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>บัตรเหนือ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Chonburi&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #fdeef2;
    --paper: #fffbfc;
    --ink: #4b1528;
    --ink-soft: #8a4d63;
    --rose: #d4537e;
    --rose-deep: #99355a;
    --rose-pale: #f6d3e0;
    --border: #f0c2d2;
    --gold: #e3a94f;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    font-family: 'Mitr', sans-serif;
    color: var(--ink);
    min-height: 100vh;
    padding: 48px 20px 80px;
    position: relative;
    overflow-x: hidden;
  }
  .bg-heart{
    position: absolute;
    font-family: 'Chonburi', serif;
    color: var(--rose-pale);
    font-size: 40px;
    user-select: none;
    pointer-events: none;
    line-height: 1;
  }
  .wrap{
    max-width: 640px;
    margin: 0 auto;
    position: relative;
  }
  header{
    text-align: center;
    margin-bottom: 36px;
  }
  .eyebrow{
    font-size: 14px;
    color: var(--ink-soft);
    letter-spacing: 0.02em;
    margin: 0 0 6px;
  }
  h1{
    font-family: 'Chonburi', serif;
    font-weight: 400;
    font-size: clamp(40px, 9vw, 56px);
    margin: 0;
    color: var(--rose-deep);
    line-height: 1.2;
  }
  .sub{
    margin: 10px 0 0;
    font-size: 16px;
    color: var(--ink-soft);
  }
  .progress-row{
    display: flex;
    align-items: center;
    gap: 14px;
    max-width: 420px;
    margin: 28px auto 0;
  }
  .bar-track{
    flex: 1;
    height: 10px;
    background: var(--rose-pale);
    border-radius: 999px;
    overflow: hidden;
  }
  .bar-fill{
    height: 100%;
    background: var(--rose);
    border-radius: 999px;
    width: 0%;
    transition: width 0.4s ease;
  }
  .progress-label{
    font-size: 14px;
    color: var(--ink-soft);
    white-space: nowrap;
    min-width: 52px;
    text-align: right;
  }
  .grid{
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 18px;
    margin-top: 36px;
  }
  @media (max-width: 420px){
    .grid{ gap: 14px; }
  }
  .coupon{
    position: relative;
    background: var(--paper);
    border: 1.5px dashed var(--border);
    border-radius: 18px;
    padding: 22px 14px 20px;
    text-align: center;
    transition: transform 0.15s ease, opacity 0.3s ease, background 0.3s ease;
  }
  .coupon::before, .coupon::after{
    content: "";
    position: absolute;
    width: 22px;
    height: 22px;
    background: var(--bg);
    border: 1.5px dashed var(--border);
    border-radius: 50%;
    left: 50%;
    transform: translateX(-50%);
  }
  .coupon::before{ top: -12px; }
  .coupon::after{ bottom: -12px; }
  .coupon .num{
    font-size: 13px;
    color: #c9a5b4;
    position: absolute;
    top: 12px;
    left: 18px;
  }
  .coupon .label{
    font-size: 21px;
    font-weight: 600;
    color: var(--rose);
    margin-top: 14px;
    transition: color 0.3s ease, text-decoration 0.3s ease;
  }
  .coupon button{
    margin-top: 14px;
    width: 100%;
    height: 38px;
    border-radius: 999px;
    border: 1.5px solid var(--rose);
    background: transparent;
    color: var(--rose);
    font-family: 'Mitr', sans-serif;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .coupon button:hover{
    background: var(--rose);
    color: #fff;
  }
  .coupon button:active{
    transform: scale(0.96);
  }
  .coupon.used{
    background: #faf5f6;
    opacity: 0.6;
  }
  .coupon.used .label{
    color: var(--ink-soft);
    text-decoration: line-through;
  }
  .coupon.used button{
    border-color: #d8c3cb;
    color: #a98a95;
    background: transparent;
    cursor: default;
  }
  .coupon.used button:hover{
    background: transparent;
    color: #a98a95;
  }
  .coupon.pop{
    animation: pop 0.35s ease;
  }
  @keyframes pop{
    0%{ transform: scale(1); }
    35%{ transform: scale(1.06); }
    100%{ transform: scale(1); }
  }
  .burst{
    position: absolute;
    top: 50%; left: 50%;
    font-size: 22px;
    pointer-events: none;
    animation: rise 0.7s ease-out forwards;
  }
  @keyframes rise{
    0%{ opacity: 1; transform: translate(-50%,-50%) scale(0.6); }
    100%{ opacity: 0; transform: translate(-50%,-140%) scale(1.2); }
  }
  footer{
    text-align: center;
    margin-top: 44px;
    font-size: 13px;
    color: #c9a5b4;
  }
  .reset-btn{
    display: block;
    margin: 30px auto 0;
    background: none;
    border: none;
    color: var(--ink-soft);
    font-family: 'Mitr', sans-serif;
    font-size: 13px;
    text-decoration: underline;
    cursor: pointer;
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <p class="eyebrow">มอบให้คนพิเศษ</p>
    <h1>บัตรเหนือ</h1>
    <p class="sub">คูปองแลกสิทธิ์ 10 ใบ กดใช้สิทธิ์เมื่อถึงเวลา</p>
    <div class="progress-row">
      <div class="bar-track"><div class="bar-fill" id="barFill"></div></div>
      <span class="progress-label" id="progressLabel">0 / 10</span>
    </div>
  </header>

  <div class="grid" id="grid"></div>

  <button class="reset-btn" id="resetBtn">เริ่มใหม่ทั้งหมด</button>
  <footer>เก็บหน้านี้ไว้ แล้วเปิดใช้ทีละใบได้เลย</footer>
</div>

<script>
  const TOTAL = 10;
  let used = new Array(TOTAL).fill(false);

  const grid = document.getElementById('grid');
  const barFill = document.getElementById('barFill');
  const progressLabel = document.getElementById('progressLabel');

  function updateProgress(){
    const count = used.filter(Boolean).length;
    barFill.style.width = (count / TOTAL * 100) + '%';
    progressLabel.textContent = count + ' / ' + TOTAL;
  }

  function makeCoupon(i){
    const el = document.createElement('div');
    el.className = 'coupon';

    const num = document.createElement('div');
    num.className = 'num';
    num.textContent = '#' + (i + 1);
    el.appendChild(num);

    const label = document.createElement('div');
    label.className = 'label';
    label.textContent = 'ใช้สิทธิ์';
    el.appendChild(label);

    const btn = document.createElement('button');
    btn.textContent = 'กดใช้';
    btn.addEventListener('click', () => {
      if (used[i]) return;
      used[i] = true;
      el.classList.add('used', 'pop');
      label.textContent = 'ใช้สิทธิ์';
      btn.textContent = 'ใช้แล้ว';

      const heart = document.createElement('div');
      heart.className = 'burst';
      heart.textContent = '💗';
      el.appendChild(heart);
      setTimeout(() => heart.remove(), 700);

      updateProgress();
    });
    el.appendChild(btn);

    return el;
  }

  for (let i = 0; i < TOTAL; i++){
    grid.appendChild(makeCoupon(i));
  }
  updateProgress();

  document.getElementById('resetBtn').addEventListener('click', () => {
    used = new Array(TOTAL).fill(false);
    grid.innerHTML = '';
    for (let i = 0; i < TOTAL; i++){
      grid.appendChild(makeCoupon(i));
    }
    updateProgress();
  });

  // decorative background hearts
  const bgHearts = ['♥','♡'];
  const positions = [
    {top:'4%', left:'6%', size:28, rot:-10},
    {top:'8%', left:'85%', size:22, rot:15},
    {top:'40%', left:'2%', size:18, rot:8},
    {top:'55%', left:'92%', size:24, rot:-12},
    {top:'85%', left:'8%', size:20, rot:6},
    {top:'92%', left:'88%', size:26, rot:-6}
  ];
  positions.forEach((p, idx) => {
    const h = document.createElement('div');
    h.className = 'bg-heart';
    h.textContent = bgHearts[idx % 2];
    h.style.top = p.top;
    h.style.left = p.left;
    h.style.fontSize = p.size + 'px';
    h.style.transform = 'rotate(' + p.rot + 'deg)';
    document.body.appendChild(h);
  });
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>บัตรเหนือ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Chonburi&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-database-compat.min.js"></script>
<style>
  :root{
    --bg: #fdeef2;
    --paper: #fffbfc;
    --ink: #4b1528;
    --ink-soft: #8a4d63;
    --rose: #d4537e;
    --rose-deep: #99355a;
    --rose-pale: #f6d3e0;
    --border: #f0c2d2;
    --gold: #e3a94f;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg: #2a1420;
      --paper: #3a1c2c;
      --ink: #fbe4ec;
      --ink-soft: #d9a9bd;
      --rose: #f27b9f;
      --rose-deep: #f6a0bc;
      --rose-pale: #4d2434;
      --border: #5c2c40;
      --gold: #e3a94f;
    }
  }
  :root[data-theme="dark"]{
    --bg: #2a1420;
    --paper: #3a1c2c;
    --ink: #fbe4ec;
    --ink-soft: #d9a9bd;
    --rose: #f27b9f;
    --rose-deep: #f6a0bc;
    --rose-pale: #4d2434;
    --border: #5c2c40;
    --gold: #e3a94f;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; height:100%; }
  html{ scroll-padding-top: env(safe-area-inset-top, 0px); }
  body{
    background: var(--bg);
    font-family: 'Mitr', sans-serif;
    color: var(--ink);
    min-height: 100vh;
    padding: calc(48px + env(safe-area-inset-top, 0px)) 20px calc(80px + env(safe-area-inset-bottom, 0px));
    position: relative;
    overflow-x: hidden;
  }
  .bg-heart{
    position: absolute;
    font-family: 'Chonburi', serif;
    color: var(--rose-pale);
    font-size: 40px;
    user-select: none;
    pointer-events: none;
    line-height: 1;
  }
  .wrap{
    max-width: 640px;
    margin: 0 auto;
    position: relative;
  }
  header{
    text-align: center;
    margin-bottom: 30px;
  }
  .eyebrow{
    font-size: 14px;
    color: var(--ink-soft);
    letter-spacing: 0.02em;
    margin: 0 0 6px;
  }
  h1{
    font-family: 'Chonburi', serif;
    font-weight: 400;
    font-size: clamp(40px, 9vw, 56px);
    margin: 0;
    color: var(--rose-deep);
    line-height: 1.2;
  }
  .sub{
    margin: 10px 0 0;
    font-size: 16px;
    color: var(--ink-soft);
  }
  .sync-status{
    margin: 10px 0 0;
    font-size: 12px;
    color: var(--ink-soft);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .dot{
    width: 7px; height: 7px; border-radius: 50%;
    background: #9bc27c;
    display: inline-block;
  }
  .dot.offline{ background: #c9a5b4; }

  .person-section{
    margin-top: 34px;
  }
  .person-header{
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 6px;
  }
  .person-header .icon{ font-size: 20px; }
  .person-header h2{
    font-family: 'Chonburi', serif;
    font-weight: 400;
    font-size: 22px;
    color: var(--rose-deep);
    margin: 0;
  }
  .person-progress{
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
  }
  .bar-track{
    flex: 1;
    height: 8px;
    background: var(--rose-pale);
    border-radius: 999px;
    overflow: hidden;
  }
  .bar-fill{
    height: 100%;
    background: var(--rose);
    border-radius: 999px;
    width: 0%;
    transition: width 0.4s ease;
  }
  .progress-label{
    font-size: 13px;
    color: var(--ink-soft);
    white-space: nowrap;
    min-width: 40px;
    text-align: right;
  }
  .grid{
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
  }
  @media (max-width: 420px){
    .grid{ gap: 10px; }
  }
  .coupon{
    position: relative;
    background: var(--paper);
    border: 1.5px dashed var(--border);
    border-radius: 18px;
    padding: 22px 10px 18px;
    text-align: center;
    transition: transform 0.15s ease, opacity 0.3s ease, background 0.3s ease;
  }
  .coupon::before, .coupon::after{
    content: "";
    position: absolute;
    width: 20px;
    height: 20px;
    background: var(--bg);
    border: 1.5px dashed var(--border);
    border-radius: 50%;
    left: 50%;
    transform: translateX(-50%);
  }
  .coupon::before{ top: -11px; }
  .coupon::after{ bottom: -11px; }
  .coupon .num{
    font-size: 12px;
    color: #c9a5b4;
    position: absolute;
    top: 12px;
    left: 14px;
  }
  .coupon .label{
    font-size: 18px;
    font-weight: 600;
    color: var(--rose);
    margin-top: 12px;
    transition: color 0.3s ease, text-decoration 0.3s ease;
  }
  .coupon button{
    margin-top: 12px;
    width: 100%;
    height: 34px;
    border-radius: 999px;
    border: 1.5px solid var(--rose);
    background: transparent;
    color: var(--rose);
    font-family: 'Mitr', sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .coupon button:hover{
    background: var(--rose);
    color: #fff;
  }
  .coupon button:active{
    transform: scale(0.96);
  }
  .coupon.used{
    background: var(--rose-pale);
    opacity: 0.7;
  }
  .coupon.used .label{
    color: var(--ink-soft);
    text-decoration: line-through;
  }
  .coupon.used button{
    border-color: var(--border);
    color: var(--ink-soft);
    background: transparent;
    cursor: default;
  }
  .coupon.used button:hover{
    background: transparent;
    color: var(--ink-soft);
  }
  .coupon .timestamp{
    font-size: 10px;
    color: #c9a5b4;
    margin-top: 6px;
    min-height: 13px;
  }
  .coupon.pop{
    animation: pop 0.35s ease;
  }
  @keyframes pop{
    0%{ transform: scale(1); }
    35%{ transform: scale(1.06); }
    100%{ transform: scale(1); }
  }
  .burst{
    position: absolute;
    top: 50%; left: 50%;
    font-size: 20px;
    pointer-events: none;
    animation: rise 0.7s ease-out forwards;
  }
  @keyframes rise{
    0%{ opacity: 1; transform: translate(-50%,-50%) scale(0.6); }
    100%{ opacity: 0; transform: translate(-50%,-140%) scale(1.2); }
  }
  footer{
    text-align: center;
    margin-top: 40px;
    font-size: 13px;
    color: #c9a5b4;
  }
  .reset-btn{
    display: block;
    margin: 30px auto 0;
    background: none;
    border: none;
    color: var(--ink-soft);
    font-family: 'Mitr', sans-serif;
    font-size: 13px;
    text-decoration: underline;
    cursor: pointer;
  }
  .modal-overlay{
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(75,21,40,0.35);
    align-items: center;
    justify-content: center;
    z-index: 10;
    padding: 20px;
  }
  .modal-overlay.open{
    display: flex;
  }
  .modal-box{
    background: var(--paper);
    border-radius: 20px;
    padding: 28px 24px;
    max-width: 320px;
    width: 100%;
    text-align: center;
    box-shadow: 0 8px 24px rgba(75,21,40,0.18);
  }
  .modal-box h3{
    font-size: 18px;
    margin: 0 0 6px;
    color: var(--rose-deep);
    font-weight: 500;
  }
  .modal-box p{
    font-size: 13px;
    color: var(--ink-soft);
    margin: 0 0 16px;
  }
  .modal-box input{
    width: 100%;
    height: 48px;
    border-radius: 12px;
    border: 1.5px solid var(--border);
    text-align: center;
    font-size: 22px;
    letter-spacing: 8px;
    font-family: 'Mitr', sans-serif;
    color: var(--ink);
    margin-bottom: 10px;
    outline: none;
    background: var(--paper);
  }
  .modal-box input:focus{
    border-color: var(--rose);
  }
  .modal-error{
    font-size: 12px;
    color: #c0304f;
    min-height: 16px;
    margin-bottom: 6px;
  }
  .modal-buttons{
    display: flex;
    gap: 10px;
    margin-top: 6px;
  }
  .modal-buttons button{
    flex: 1;
    height: 40px;
    border-radius: 999px;
    font-family: 'Mitr', sans-serif;
    font-size: 14px;
    cursor: pointer;
  }
  .modal-cancel{
    background: transparent;
    border: 1.5px solid var(--border);
    color: var(--ink-soft);
  }
  .modal-confirm{
    background: var(--rose);
    border: 1.5px solid var(--rose);
    color: #fff;
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <p class="eyebrow">มอบให้คนพิเศษ</p>
    <h1>บัตรเหนือ</h1>
    <p class="sub">คูปองแลกสิทธิ์คนละ 3 ใบ กดใช้สิทธิ์เมื่อถึงเวลา</p>
    <div class="sync-status" id="syncStatus"><span class="dot offline" id="syncDot"></span><span id="syncText">กำลังเชื่อมต่อ...</span></div>
  </header>

  <div class="person-section">
    <div class="person-header"><span class="icon">🌸</span><h2>ฉัน</h2></div>
    <div class="person-progress">
      <div class="bar-track"><div class="bar-fill" id="barFill-mine"></div></div>
      <span class="progress-label" id="progressLabel-mine">0 / 3</span>
    </div>
    <div class="grid" id="grid-mine"></div>
  </div>

  <div class="person-section">
    <div class="person-header"><span class="icon">💌</span><h2>แฟน</h2></div>
    <div class="person-progress">
      <div class="bar-track"><div class="bar-fill" id="barFill-partner"></div></div>
      <span class="progress-label" id="progressLabel-partner">0 / 3</span>
    </div>
    <div class="grid" id="grid-partner"></div>
  </div>

  <button class="reset-btn" id="resetBtn">เริ่มใหม่ทั้งหมด</button>
  <footer>เก็บลิงก์นี้ไว้ เปิดจากที่ไหนก็เห็นเหมือนกัน</footer>
</div>

<div class="modal-overlay" id="pinOverlay">
  <div class="modal-box">
    <h3>ใส่รหัสเพื่อเริ่มใหม่</h3>
    <p>พิมพ์รหัส 4 ตัวเพื่อยืนยัน</p>
    <input type="tel" inputmode="numeric" maxlength="4" id="pinInput" autocomplete="off">
    <div class="modal-error" id="pinError"></div>
    <div class="modal-buttons">
      <button class="modal-cancel" id="pinCancel">ยกเลิก</button>
      <button class="modal-confirm" id="pinConfirm">ยืนยัน</button>
    </div>
  </div>
</div>

<script>
  // ===== ใส่ค่าจาก Firebase Console ของคุณตรงนี้ (ขั้นตอนที่ 2) =====
  const firebaseConfig = {
    apiKey: "AIzaSyAujaL1OomYtbQiDjz6jEoGHx35lBNUscw",
    authDomain: "bat-neua.firebaseapp.com",
    databaseURL: "https://bat-neua-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "bat-neua",
    storageBucket: "bat-neua.firebasestorage.app",
    messagingSenderId: "162078335255",
    appId: "1:162078335255:web:50f0446e376e71efc5d752",
    measurementId: "G-4HP57WFT07"
  };
  // ===================================================================

  const GROUPS = ['mine', 'partner'];
  const PER_GROUP = 3;
  const RESET_PIN = '3008';
  const DB_PATH = 'coupons/state';

  // state[group] = array of TOTAL, each null or ISO timestamp string
  let state = { mine: new Array(PER_GROUP).fill(null), partner: new Array(PER_GROUP).fill(null) };

  let dbRef = null;      // firebase database ref at DB_PATH once resolved
  let usingFallback = false;
  const FALLBACK_KEY = 'bat-neua-coupons-v2';

  function loadFallback(){
    try{
      const raw = localStorage.getItem(FALLBACK_KEY);
      if (!raw) return null;
      const parsed = JSON.parse(raw);
      if (parsed && Array.isArray(parsed.mine) && Array.isArray(parsed.partner)) return parsed;
      return null;
    }catch(e){ return null; }
  }
  function saveFallback(){
    try{ localStorage.setItem(FALLBACK_KEY, JSON.stringify(state)); }catch(e){}
  }

  function setSyncStatus(mode){
    const dot = document.getElementById('syncDot');
    const text = document.getElementById('syncText');
    if (mode === 'live'){
      dot.classList.remove('offline');
      text.textContent = 'ซิงก์กันสด ๆ — เปิดคนละที่ก็เห็นตรงกัน';
    } else if (mode === 'connecting'){
      dot.classList.add('offline');
      text.textContent = 'กำลังเชื่อมต่อ...';
    } else {
      dot.classList.add('offline');
      text.textContent = 'โหมดออฟไลน์ — เห็นเฉพาะเครื่องนี้';
    }
  }

  function formatTime(iso){
    const d = new Date(iso);
    const dd = String(d.getDate()).padStart(2,'0');
    const mm = String(d.getMonth()+1).padStart(2,'0');
    const yy = String(d.getFullYear()).slice(-2);
    const hh = String(d.getHours()).padStart(2,'0');
    const mi = String(d.getMinutes()).padStart(2,'0');
    return `ใช้เมื่อ ${dd}/${mm}/${yy} ${hh}:${mi}`;
  }

  function updateProgress(group){
    const arr = state[group];
    const count = arr.filter(Boolean).length;
    document.getElementById('barFill-' + group).style.width = (count / PER_GROUP * 100) + '%';
    document.getElementById('progressLabel-' + group).textContent = count + ' / ' + PER_GROUP;
  }

  const paintFns = { mine: [], partner: [] };

  function makeCoupon(group, i){
    const el = document.createElement('div');
    el.className = 'coupon';

    const num = document.createElement('div');
    num.className = 'num';
    num.textContent = '#' + (i + 1);
    el.appendChild(num);

    const label = document.createElement('div');
    label.className = 'label';
    label.textContent = 'ใช้สิทธิ์';
    el.appendChild(label);

    const btn = document.createElement('button');
    el.appendChild(btn);

    const ts = document.createElement('div');
    ts.className = 'timestamp';
    el.appendChild(ts);

    function paint(animate){
      const was = el.classList.contains('used');
      if (state[group][i]){
        el.classList.add('used');
        btn.textContent = 'ใช้แล้ว';
        ts.textContent = formatTime(state[group][i]);
        if (animate && !was){
          el.classList.add('pop');
          const heart = document.createElement('div');
          heart.className = 'burst';
          heart.textContent = '💗';
          el.appendChild(heart);
          setTimeout(() => heart.remove(), 700);
          setTimeout(() => el.classList.remove('pop'), 400);
        }
      } else {
        el.classList.remove('used');
        btn.textContent = 'กดใช้';
        ts.textContent = '';
      }
    }

    btn.addEventListener('click', () => {
      if (state[group][i]) return;
      commitUse(group, i);
    });

    paintFns[group][i] = paint;
    paint(false);
    return el;
  }

  function renderAll(){
    GROUPS.forEach(group => {
      const grid = document.getElementById('grid-' + group);
      grid.innerHTML = '';
      paintFns[group] = [];
      for (let i = 0; i < PER_GROUP; i++){
        grid.appendChild(makeCoupon(group, i));
      }
      updateProgress(group);
    });
  }

  function repaintFromState(animateChanged){
    GROUPS.forEach(group => {
      for (let i = 0; i < PER_GROUP; i++){
        if (paintFns[group][i]) paintFns[group][i](animateChanged);
      }
      updateProgress(group);
    });
  }

  async function commitUse(group, i){
    const now = new Date().toISOString();
    // optimistic local update
    state[group][i] = now;
    repaintFromState(true);

    if (dbRef){
      try{
        await dbRef.update({ [group]: state[group] });
      }catch(e){
        try{ await dbRef.set(state); }catch(e2){ saveFallback(); }
      }
    } else {
      saveFallback();
    }
  }

  async function doReset(){
    state = { mine: new Array(PER_GROUP).fill(null), partner: new Array(PER_GROUP).fill(null) };
    repaintFromState(false);
    if (dbRef){
      try{ await dbRef.set(state); }catch(e){ saveFallback(); }
    } else {
      saveFallback();
    }
  }

  function initSync(){
    setSyncStatus('connecting');

    const configured = firebaseConfig.apiKey && !firebaseConfig.apiKey.includes('ใส่');
    if (!configured || typeof firebase === 'undefined'){
      usingFallback = true;
      const fb = loadFallback();
      if (fb) state = fb;
      renderAll();
      setSyncStatus('offline');
      return;
    }

    try{
      firebase.initializeApp(firebaseConfig);
      const database = firebase.database();
      dbRef = database.ref(DB_PATH);
      renderAll();

      dbRef.on('value', (snap) => {
        const data = snap.val();
        if (data && Array.isArray(data.mine) && Array.isArray(data.partner)){
          state = { mine: data.mine, partner: data.partner };
          repaintFromState(true);
          setSyncStatus('live');
        } else if (!data) {
          // ยังไม่มีข้อมูล — seed ด้วยสถานะเริ่มต้น
          dbRef.set(state).then(() => setSyncStatus('live')).catch(() => setSyncStatus('offline'));
        } else {
          setSyncStatus('live');
        }
      }, (err) => {
        usingFallback = true;
        const fb = loadFallback();
        if (fb) { state = fb; repaintFromState(false); }
        setSyncStatus('offline');
      });
    }catch(e){
      usingFallback = true;
      const fb = loadFallback();
      if (fb) state = fb;
      renderAll();
      setSyncStatus('offline');
    }
  }

  initSync();

  const pinOverlay = document.getElementById('pinOverlay');
  const pinInput = document.getElementById('pinInput');
  const pinError = document.getElementById('pinError');
  const pinCancel = document.getElementById('pinCancel');
  const pinConfirm = document.getElementById('pinConfirm');

  function openPinModal(){
    pinInput.value = '';
    pinError.textContent = '';
    pinOverlay.classList.add('open');
    setTimeout(() => pinInput.focus(), 50);
  }

  function closePinModal(){
    pinOverlay.classList.remove('open');
  }

  function tryConfirmPin(){
    if (pinInput.value.trim() === ''){
      pinError.textContent = 'กรอกรหัสก่อน';
      return;
    }
    if (pinInput.value !== RESET_PIN){
      pinError.textContent = 'รหัสไม่ถูกต้อง';
      pinInput.value = '';
      pinInput.focus();
      return;
    }
    doReset();
    closePinModal();
  }

  document.getElementById('resetBtn').addEventListener('click', openPinModal);
  pinCancel.addEventListener('click', closePinModal);
  pinConfirm.addEventListener('click', tryConfirmPin);
  pinOverlay.addEventListener('click', (e) => {
    if (e.target === pinOverlay) closePinModal();
  });
  pinInput.addEventListener('input', () => {
    pinError.textContent = '';
  });
  pinInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') tryConfirmPin();
  });

  // decorative background hearts
  const bgHearts = ['♥','♡'];
  const positions = [
    {top:'4%', left:'6%', size:28, rot:-10},
    {top:'8%', left:'85%', size:22, rot:15},
    {top:'40%', left:'2%', size:18, rot:8},
    {top:'55%', left:'92%', size:24, rot:-12},
    {top:'85%', left:'8%', size:20, rot:6},
    {top:'92%', left:'88%', size:26, rot:-6}
  ];
  positions.forEach((p, idx) => {
    const h = document.createElement('div');
    h.className = 'bg-heart';
    h.textContent = bgHearts[idx % 2];
    h.style.top = p.top;
    h.style.left = p.left;
    h.style.fontSize = p.size + 'px';
    h.style.transform = 'rotate(' + p.rot + 'deg)';
    document.body.appendChild(h);
  });
</script>

</body>
</html>
